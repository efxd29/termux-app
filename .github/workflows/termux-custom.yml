name: Termux Custom

on:
  push:
    branches:
      - termux-custom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build original Termux custom APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact custom branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build from the APK-matching source revision
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          RELEASE_VERSION_NAME="${VERSION_NAME}+${SHORT_SHA}"
          APK_VERSION_TAG="v${RELEASE_VERSION_NAME}-apt-android-7-github-debug"

          echo "Source commit: $(git rev-parse HEAD)"
          echo "Building ${RELEASE_VERSION_NAME} for apt-android-7 / arm64-v8a"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME}"
          export TERMUX_APK_VERSION_TAG="${APK_VERSION_TAG}"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          export TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS="1"

          ./gradlew --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/termux-app_${APK_VERSION_TAG}_arm64-v8a.apk"
          test -s "${APK}"
          sha256sum "${APK}" > "${APK}.sha256"
          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"

      - name: Upload custom APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: termux-custom-arm64-v8a
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30
